
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>李沂柔的攝影作品集</title>
<style>
body {margin: 0;  background: #FFF8E7;  color: #42382F;  font-family: Arial, sans-serif;}

header {text-align: center;  padding: 40px 15px;}

h1 {font-size: 28px;}
header p {color: #887966;}

main {max-width: 700px;  margin: auto;  padding: 15px 20px;}

.album-grid {display: grid;  grid-template-columns: repeat(2, minmax(0, 1fr));  gap: 25px 18px;}

.album {display: block;  text-decoration: none;  color: #42382F;}

.album img {display: block;  width: 100%;  aspect-ratio: 4 / 3;  object-fit: cover;  border-radius: 5px;}

.album h2 {font-size: 17px;  font-weight: normal;  margin: 10px 0 5px;}

.album span {font-size: 12px;  color: #887966;}

footer {text-align: center;  padding: 25px 10px;  color: #887966;  font-size: 13px;}
</style>
</head>
<body>
<header>
  <h1>李沂柔的攝影作品集</h1>
  <p>用鏡頭記錄生活</p>
</header>

<main>
  <div class="album-grid">

    <a class="album" href="https://photos.app.goo.gl/RSAkFCN4rnxFngG56" target="_blank">
      <img src="img/04.png" alt="人像攝影">
      <h2>人像攝影</h2>
      <span>作業二｜基本布光模式</span>
    </a>

    <a class="album" href="https://photos.app.goo.gl/X3VzbY7mmYDFXRfm6" target="_blank">
      <img src="img/2.jpg" alt="孔廟外拍">
      <h2>孔廟外拍</h2>
      <span>作業三｜外拍紀錄</span>
    </a>

    <a class="album" href="https://photos.app.goo.gl/ZJmUoRrmcTAsWBtk7" target="_blank">
      <img src="img/IMG_6126.jpg" alt="靜物攝影">
      <h2>商品攝影</h2>
      <span>作業四｜靜物篇</span>
    </a>

    <a class="album" href="https://photos.app.goo.gl/HZHBKhiNAnq4Evac8" target="_blank">
      <img src="img/IMG_6071.JPG" alt="安平老街外拍">
      <h2>安平老街</h2>
      <span>作業五｜劍獅尋寶圖</span>
    </a>

  </div>
</main>

<footer>

</html>
